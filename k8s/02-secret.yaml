apiVersion: v1
kind: Secret
metadata:
  name: fcg-secrets
  namespace: fcg
type: Opaque
# stringData: valores em texto puro (o k8s codifica em base64).
# ATENCAO: valores de EXEMPLO. NAO comite segredos reais em producao.
stringData:
  RabbitMq__Password: "fcg123"
  JwtSettings__SecretKey: "6a8a56f4d31a272d6e2f048f710c9cce45b51aa343fd6f73d8b69f1218eaac56"
  # Connection strings completas (cada servico aponta para o SEU banco):
  Users__ConnectionString: "Host=postgres;Port=5432;Database=fcgdb;Username=fcg;Password=fcg123"
  Catalog__ConnectionString: "Host=postgres;Database=catalogdb;Username=fcg;Password=fcg123"
  # Cache do catalog-api. `abortConnect=false` deixa o app subir mesmo com o Redis
  # ainda fora do ar (ele reconecta sozinho) -- sem isso o pod morre no startup se
  # a ordem de subida inverter. As credenciais casam com a ACL de k8s/12-redis.yaml.
  Catalog__RedisConnection: "redis:6379,user=fcg,password=fcg123,abortConnect=false"
  Payments__ConnectionString: "Host=postgres;Database=paymentsdb;Username=fcg;Password=fcg123"
  # Credenciais AWS para users-api/payments-api publicarem no SNS (fcg-user-events /
  # fcg-payment-events). PREENCHA com credenciais reais antes do deploy — em producao,
  # prefira um IAM role em vez de chaves estaticas.
  AWS_ACCESS_KEY_ID: "SUBSTITUA_AQUI"
  AWS_SECRET_ACCESS_KEY: "SUBSTITUA_AQUI"
