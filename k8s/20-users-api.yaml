apiVersion: apps/v1
kind: Deployment
metadata:
  name: users-api
  namespace: fcg
spec:
  replicas: 2
  selector:
    matchLabels: { app: users-api }
  template:
    metadata:
      labels: { app: users-api }
    spec:
      containers:
        - name: users-api
          image: fcg/users-api:1.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: ASPNETCORE_ENVIRONMENT
              valueFrom: { configMapKeyRef: { name: fcg-config, key: ASPNETCORE_ENVIRONMENT } }
            - name: JwtSettings__ExpirationHours
              valueFrom: { configMapKeyRef: { name: fcg-config, key: JwtSettings__ExpirationHours } }
            # Claim `iss` emitida no token; o gateway (Kong) valida este valor.
            - name: JwtSettings__Issuer
              valueFrom: { configMapKeyRef: { name: fcg-config, key: JWT_ISSUER } }
            # UserRegisteredEvent vai por SNS (consumido pela Lambda do NotificationsAPI).
            - name: Sns__TopicArn
              valueFrom: { configMapKeyRef: { name: fcg-config, key: Sns__UserEventsTopicArn } }
            - name: AWS_REGION
              valueFrom: { configMapKeyRef: { name: fcg-config, key: AWS_REGION } }
            - name: AWS_ACCESS_KEY_ID
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: AWS_ACCESS_KEY_ID } }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: AWS_SECRET_ACCESS_KEY } }
            - name: JwtSettings__SecretKey
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: JwtSettings__SecretKey } }
            - name: ConnectionStrings__DefaultConnection
              valueFrom: { secretKeyRef: { name: fcg-secrets, key: Users__ConnectionString } }
            # Ativa o profiler do CLR. Sem estas 4 variaveis o pacote NewRelic.Agent
            # fica instalado em /app/newrelic mas NUNCA e carregado (agente inerte).
            # O GUID precisa de aspas: sem elas o YAML leria {..} como um mapa.
            - name: CORECLR_ENABLE_PROFILING
              value: "1"
            - name: CORECLR_PROFILER
              value: "{36032161-FFC0-4B61-B559-F6C5D41BAE5A}"
            - name: CORECLR_NEWRELIC_HOME
              value: /app/newrelic
            - name: CORECLR_PROFILER_PATH
              value: /app/newrelic/libNewRelicProfiler.so
            - name: NEW_RELIC_LICENSE_KEY
              valueFrom: { secretKeyRef: { name: new-relic, key: license-key } }
            - name: NEW_RELIC_APP_NAME
              value: "FIAPCloudGames-fase3-UsersAPI"
            - name: NEW_RELIC_DISTRIBUTED_TRACING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_ENABLED
              value: "true"
            - name: NEW_RELIC_APPLICATION_LOGGING_FORWARDING_ENABLED
              value: "true"
          # Usuários não expõe /health: sonda TCP na porta 8080.
          livenessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            tcpSocket: { port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: users-api
  namespace: fcg
spec:
  type: ClusterIP
  selector: { app: users-api }
  ports:
    - port: 8080
      targetPort: 8080
